services:
  db:
    image: postgres:16-alpine
    container_name: fitverse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitverse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitverse_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-fitverse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fitverse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitverse_user} -d ${POSTGRES_DB:-fitverse}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fitverse_pgdata: